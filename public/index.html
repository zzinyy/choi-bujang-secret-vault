<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#101a28">
  <title>BYTE BACK | 최 부장의 비밀 자료실</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101a28;
      color: #ecf4ff;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 44px 22px 64px;
    }

    .eyebrow {
      color: #8ad8df;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    h1 {
      margin: 16px 0;
      font-size: clamp(30px, 7vw, 48px);
      line-height: 1.2;
    }

    h2 {
      margin-top: 0;
    }

    p {
      font-size: 17px;
      line-height: 1.7;
      color: #bfd0e5;
    }

    .panel {
      margin: 26px 0;
      padding: 18px;
      border: 1px solid #51667c;
      border-radius: 14px;
      background: #1a2a3d;
    }

    .fields {
      display: grid;
      gap: 10px;
    }

    input,
    textarea,
    button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #657b92;
      border-radius: 9px;
      font: inherit;
    }

    input,
    textarea {
      background: #101a28;
      color: #ecf4ff;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      background: #d7f4f6;
      color: #10202c;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .note-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .note-actions button {
      width: auto;
      flex: 1;
    }

    #auth-message,
    #note-message {
      min-height: 1.5em;
      margin-bottom: 0;
    }

    ul {
      list-style: none;
      display: grid;
      gap: 12px;
      padding: 0;
    }

    li {
      border: 1px solid #51667c;
      border-radius: 14px;
      padding: 17px 19px;
      background: #1a2a3d;
    }

    strong {
      display: block;
      font-size: 18px;
      margin-bottom: 5px;
    }

    li span {
      color: #bfd0e5;
      white-space: pre-wrap;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계</div>

    <h1>최 부장의 비밀 자료실</h1>

    <p>
      Supabase Auth로 로그인한 사용자만 가상 메모 API를 사용할 수 있습니다.
    </p>

    <section id="logged-out" class="panel">
      <h2>로그인</h2>

      <form id="login-form" class="fields">
        <label>
          이메일
          <input
            id="email"
            type="email"
            autocomplete="username"
            required
          >
        </label>

        <label>
          비밀번호
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
          >
        </label>

        <button id="login-button" type="submit">
          로그인
        </button>
      </form>
    </section>

    <section id="logged-in" class="panel" hidden>
      <h2>로그인 상태</h2>

      <p id="user-status"></p>

      <button id="logout-button" type="button">
        로그아웃
      </button>
    </section>

    <p
      id="auth-message"
      role="status"
      aria-live="polite"
    ></p>

    <section id="device-approval" class="panel" hidden>
      <h2>기기 승인</h2>

      <p id="device-status" role="status" aria-live="polite">
        기기 승인 상태를 확인하고 있습니다.
      </p>

      <button id="device-request-button" type="button">
        기기 승인 요청
      </button>

      <button id="device-check-button" type="button">
        승인 상태 다시 확인
      </button>

      <p>
        앱 설치만으로 기기가 승인되지는 않습니다.
        서버에서 등록 및 승인 여부를 확인한 후
        보호 자료에 접근할 수 있습니다.
      </p>
    </section>

    <section id="note-editor" class="panel" hidden>
      <h2 id="editor-title">새 메모</h2>

      <form id="note-form" class="fields">
        <input id="note-id" type="hidden">

        <label>
          제목
          <input
            id="note-title"
            type="text"
            maxlength="200"
            required
          >
        </label>

        <label>
          내용
          <textarea
            id="note-body"
            maxlength="5000"
            required
          ></textarea>
        </label>

        <button id="save-note-button" type="submit">
          메모 추가
        </button>

        <button
          id="cancel-edit-button"
          type="button"
          hidden
        >
          수정 취소
        </button>
      </form>

      <p
        id="note-message"
        role="status"
        aria-live="polite"
      ></p>
    </section>

    <section id="notes-section" hidden>
      <h2>가상 메모</h2>

      <ul id="notes" aria-live="polite">
        <li>로그인하면 가상 메모를 볼 수 있습니다.</li>
      </ul>
    </section>
  </main>

  <script type="module">
import {
  createDeviceKey,
  setDeviceId,
  clearDevice,
  createDeviceHeaders
} from './device-auth.js';


    const loggedOut =
      document.querySelector('#logged-out');

    const loggedIn =
      document.querySelector('#logged-in');

    const loginForm =
      document.querySelector('#login-form');

    const loginButton =
      document.querySelector('#login-button');

    const logoutButton =
      document.querySelector('#logout-button');

    const userStatus =
      document.querySelector('#user-status');

    const authMessage =
      document.querySelector('#auth-message');

const deviceApproval =
  document.querySelector('#device-approval');

const notesSection = document.querySelector('#notes-section');

const deviceStatus =
  document.querySelector('#device-status');

const deviceRequestButton =
  document.querySelector('#device-request-button');

const deviceCheckButton =
  document.querySelector('#device-check-button');

deviceCheckButton.addEventListener('click', async () => {
  if (!currentSession?.access_token) {
    deviceStatus.textContent = '먼저 로그인해 주세요.';
    return;
  }

  const checkedSession = currentSession;
  deviceCheckButton.disabled = true;
  deviceStatus.textContent = '기기 승인 상태를 확인하고 있습니다.';

  try {
    const path = '/api/device/status';
    const deviceHeaders = await createDeviceHeaders('GET', path);

    const response = await fetch(path, {
      method: 'GET',
      cache: 'no-store',
      headers: {
        Authorization: `Bearer ${currentSession.access_token}`,
        ...deviceHeaders
      }
    });

    const data = await readJson(response);
    if (currentSession !== checkedSession) return;

    if (!response.ok) {
      throw new Error(data.error || '승인 상태 확인 실패');
    }

if (data.approved !== true) {
  deviceApproved = false;
  hideProtectedNotes();

  deviceStatus.textContent =
    '아직 승인되지 않은 기기입니다. 서버 승인을 기다려 주세요.';
  return;
}

deviceApproved = true;
deviceStatus.textContent = '기기 승인이 확인되었습니다.';
notesSection.hidden = false;
noteEditor.hidden = false;

    await loadNotes();
} catch (error) {
  if (currentSession !== checkedSession) return;
  deviceApproved = false;
  hideProtectedNotes();

  deviceStatus.textContent =
    error.message || '기기 승인 확인 중 오류가 발생했습니다.';
} finally {
    deviceCheckButton.disabled = false;
  }
});

deviceRequestButton.addEventListener('click', async () => {
  deviceRequestButton.disabled = true;
  if (!currentSession?.access_token) {
    deviceStatus.textContent = '먼저 로그인해 주세요.';
    return;
  }
  deviceApproved = false;
  hideProtectedNotes();
  deviceStatus.textContent = '기기 등록을 요청하고 있습니다.';

  try {
    const publicKeyJwk = await createDeviceKey();

    const response = await fetch('/api/device/request', {
      method: 'POST',
      cache: 'no-store',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${currentSession.access_token}`
      },
      body: JSON.stringify({ publicKeyJwk })
    });

    const data = await readJson(response);

    if (!response.ok || !data.deviceId) {
      throw new Error(data.error || '기기 등록 요청 실패');
    }

    setDeviceId(data.deviceId);

    deviceStatus.textContent =
      '기기 등록 요청 완료. 서버 승인을 기다리고 있습니다.';
  } catch (error) {
    clearDevice();
    deviceStatus.textContent =
      error.message || '기기 등록 중 오류가 발생했습니다.';
  } finally {
    deviceRequestButton.disabled = false;
  }
});

    const noteEditor =
      document.querySelector('#note-editor');

    const noteForm =
      document.querySelector('#note-form');

    const noteId =
      document.querySelector('#note-id');

    const noteTitle =
      document.querySelector('#note-title');

    const noteBody =
      document.querySelector('#note-body');

    const editorTitle =
      document.querySelector('#editor-title');

    const saveNoteButton =
      document.querySelector('#save-note-button');

    const cancelEditButton =
      document.querySelector('#cancel-edit-button');

    const noteMessage =
      document.querySelector('#note-message');

    const list =
      document.querySelector('#notes');

let currentSession = null;
let memorySession = null;
let deviceApproved = false;
let sessionVersion = 0;

function hideProtectedNotes() {
  notesSection.hidden = true;
  noteEditor.hidden = true;
  resetNoteForm();
  showNoteMessage('기기 승인 후 메모를 확인할 수 있습니다.');
}

function saveSession(session) {
  memorySession =
    session?.access_token && session?.refresh_token
      ? session
      : null;
}

function readStoredSession() {
  return memorySession;
}

    function showSession(session) {
      currentSession = session;
      sessionVersion += 1;
      deviceApproved = false;
      hideProtectedNotes();

      const isLoggedIn =
        Boolean(
          session?.user &&
          session?.access_token
        );

loggedOut.hidden = isLoggedIn;
loggedIn.hidden = !isLoggedIn;

// 기기 승인 전에는 메모 편집 화면을 표시하지 않는다.
noteEditor.hidden = true;

// 로그인한 사용자에게만 기기 승인 화면을 표시한다.
document.querySelector('#device-approval').hidden = !isLoggedIn;

      userStatus.textContent = isLoggedIn
        ? '인증된 계정으로 로그인했습니다.'
        : '';

      if (!isLoggedIn) {
        resetNoteForm();
      }
    }

    function showNoteMessage(message) {
      const item =
        document.createElement('li');

      item.textContent = message;

      list.replaceChildren(item);
    }

    function resetNoteForm() {
      noteForm.reset();
      noteId.value = '';
      editorTitle.textContent = '새 메모';
      saveNoteButton.textContent = '메모 추가';
      cancelEditButton.hidden = true;
      noteMessage.textContent = '';
    }

    function authorizationHeaders() {
      if (!currentSession?.access_token) {
        return null;
      }

      return {
        Authorization:
          `Bearer ${currentSession.access_token}`
      };
    }

    async function readJson(response) {
      try {
        return await response.json();
      } catch {
        return {};
      }
    }

async function loadNotes(session = currentSession) {
  if (!deviceApproved || !session?.access_token || session?.access_token !== currentSession?.access_token) {
    showNoteMessage('기기 승인 후 메모를 확인할 수 있습니다.');
    return;
  }

  if (!session?.access_token) {
        showNoteMessage(
          '로그인하면 가상 메모를 볼 수 있습니다.'
        );
        return;
      }

      const versionAtStart = sessionVersion;
      try {
        const path = '/api/notes';

const deviceHeaders =
  await createDeviceHeaders('GET', path);

const response =
  await fetch(path, {
    method: 'GET',
    cache: 'no-store',
    headers: {
      Authorization:
        `Bearer ${session.access_token}`,
      ...deviceHeaders
    }
  });

        const data =
          await readJson(response);

        if (!response.ok) {
          throw new Error(
            data.error ||
            '메모를 읽을 수 없습니다.'
          );
        }

        if (!deviceApproved || versionAtStart !== sessionVersion) return;

        if (!Array.isArray(data.notes)) {
          throw new Error(
            '메모 형식이 올바르지 않습니다.'
          );
        }

        if (data.notes.length === 0) {
          showNoteMessage(
            '등록된 가상 메모가 없습니다.'
          );
          return;
        }

        const items =
          data.notes.map((note) => {
            const item =
              document.createElement('li');

            const title =
              document.createElement('strong');

            const content =
              document.createElement('span');

            const actions =
              document.createElement('div');

            const editButton =
              document.createElement('button');

            const deleteButton =
              document.createElement('button');

            title.textContent = note.title;
            content.textContent = note.body;

            actions.className =
              'note-actions';

            editButton.type = 'button';
            editButton.textContent = '수정';

            deleteButton.type = 'button';
            deleteButton.textContent = '삭제';

            editButton.addEventListener(
              'click',
              () => {
                noteId.value = note.id;
                noteTitle.value = note.title;
                noteBody.value = note.body;

                editorTitle.textContent =
                  '메모 수정';

                saveNoteButton.textContent =
                  '수정 저장';

                cancelEditButton.hidden = false;
                noteMessage.textContent = '';

                noteTitle.focus();
              }
            );

            deleteButton.addEventListener(
              'click',
              async () => {
                const confirmed =
                  window.confirm(
                    '이 메모를 삭제하시겠습니까?'
                  );

                if (!confirmed) {
                  return;
                }

                const headers =
                  authorizationHeaders();

                if (!headers) {
                  noteMessage.textContent =
                    '로그인이 필요합니다.';
                  return;
                }

                deleteButton.disabled = true;

                try {
                 const path =
  `/api/notes/${encodeURIComponent(note.id)}`;

const deviceHeaders =
  await createDeviceHeaders('DELETE', path);

const response =
  await fetch(path, {
    method: 'DELETE',
    headers: {
      ...headers,
      ...deviceHeaders
    }
  });

                  const data =
                    await readJson(response);

                  if (!response.ok) {
                    throw new Error(
                      data.error ||
                      '메모 삭제에 실패했습니다.'
                    );
                  }

                  resetNoteForm();

                  noteMessage.textContent =
                    '메모를 삭제했습니다.';

                  await loadNotes();
                } catch (error) {
                  noteMessage.textContent =
                    error.message;
                } finally {
                  deleteButton.disabled = false;
                }
              }
            );

            actions.append(
              editButton,
              deleteButton
            );

            item.append(
              title,
              content,
              actions
            );

            return item;
          });

        list.replaceChildren(...items);
      } catch (error) {
        if (deviceApproved && versionAtStart === sessionVersion) showNoteMessage(error.message);
      }
    }

    loginForm.addEventListener(
      'submit',
      async (event) => {
        event.preventDefault();

        authMessage.textContent = '';
        loginButton.disabled = true;

        const email =
          document.querySelector('#email').value;

        const password =
          document.querySelector('#password').value;

        try {
          const response =
            await fetch('/api/auth-login', {
              method: 'POST',
              headers: {
                'Content-Type':
                  'application/json'
              },
              body: JSON.stringify({
                email,
                password
              })
            });

          const data =
            await readJson(response);

          if (
            !response.ok ||
            !data.session
          ) {
            throw new Error(
              data.error ||
              'LOGIN_FAILED'
            );
          }

          loginForm.reset();
saveSession(data.session);
showSession(data.session);

deviceApproved = false;
hideProtectedNotes();

authMessage.textContent =
  '로그인되었습니다.';
        } catch (error) {
          authMessage.textContent =
            `로그인 실패: ${error.message}`;
        } finally {
          loginButton.disabled = false;
        }
      }
    );

    logoutButton.addEventListener(
      'click',
      async () => {
        authMessage.textContent = '';

        const headers =
          authorizationHeaders();

        try {
          if (headers) {
            const response =
              await fetch('/api/auth-logout', {
                method: 'POST',
                headers
              });

            if (!response.ok) {
              const data =
                await readJson(response);

              throw new Error(
                data.error ||
                'LOGOUT_FAILED'
              );
            }
          }

saveSession(null);
deviceApproved = false;
clearDevice();
showSession(null);

showNoteMessage('로그인 및 기기 승인 후 메모를 확인할 수 있습니다.');

          authMessage.textContent =
            '로그아웃되었습니다.';
        } catch (error) {
          authMessage.textContent =
            `로그아웃 실패: ${error.message}`;
        }
      }
    );

    noteForm.addEventListener(
      'submit',
      async (event) => {
        event.preventDefault();

        const headers =
          authorizationHeaders();

        if (!headers || !deviceApproved) {
          noteMessage.textContent =
            '기기 승인이 필요합니다.';
          return;
        }

        const title =
          noteTitle.value.trim();

        const body =
          noteBody.value.trim();

        if (!title || !body) {
          noteMessage.textContent =
            '제목과 내용을 모두 입력해주세요.';
          return;
        }

        const editingId =
          noteId.value;

        saveNoteButton.disabled = true;
        noteMessage.textContent = '';

        try {
          const path = editingId
  ? `/api/notes/${encodeURIComponent(editingId)}`
  : '/api/notes';

const method = editingId ? 'PUT' : 'POST';

const requestBody = JSON.stringify({
  title,
  body
});

const deviceHeaders =
  await createDeviceHeaders(method, path, requestBody);

const response = await fetch(path, {
  method,
  headers: {
    ...headers,
    ...deviceHeaders,
    'Content-Type': 'application/json'
  },
  body: requestBody
});

          const data =
            await readJson(response);

          if (!response.ok) {
            throw new Error(
              data.error ||
              (
                editingId
                  ? '메모 수정에 실패했습니다.'
                  : '메모 추가에 실패했습니다.'
              )
            );
          }

          resetNoteForm();

          noteMessage.textContent =
            editingId
              ? '메모를 수정했습니다.'
              : '메모를 추가했습니다.';

          await loadNotes();
        } catch (error) {
          noteMessage.textContent =
            error.message;
        } finally {
          saveNoteButton.disabled = false;
        }
      }
    );

    cancelEditButton.addEventListener(
      'click',
      () => {
        resetNoteForm();
      }
    );

    async function restoreSession() {
      const storedSession = readStoredSession();
      deviceApproved = false;
      hideProtectedNotes();
      if (!storedSession?.refresh_token) {
        showSession(null);
        return;
      }

      try {
        const response = await fetch('/api/auth-refresh', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: storedSession.refresh_token })
        });
        const data = await readJson(response);
        if (!response.ok || !data.session) throw new Error('REFRESH_FAILED');
        saveSession(data.session);
        showSession(data.session);
      } catch {
        saveSession(null);
        showSession(null);
      }
    }

    await restoreSession();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .catch((error) => {
            console.error('서비스 워커 등록 실패:', error);
          });
      });
    }
  </script>
</body>
</html>
